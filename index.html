<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE ZERO V11</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eaf1ff;color:#1f2937} .wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#4f7cff,#2563eb);color:#fff;border-radius:24px;padding:24px}.card{background:#fff;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 8px 20px rgba(0,0,0,.08)}h1{font-size:44px;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center}.progress{height:10px;background:#dbe7ff;border-radius:99px;overflow:hidden}.fill{height:100%;background:#4f7cff;width:0}.task{display:flex;align-items:center;gap:10px;padding:8px 0}.task input{width:22px;height:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;padding:12px;background:#4f7cff;color:#fff;font-weight:700}input,textarea{width:100%;padding:10px;border:1px solid #d7e3ff;border-radius:10px;box-sizing:border-box}.srow{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:6px 0}.timer{font-size:54px;text-align:center;font-weight:800;margin:10px 0}.nav{position:sticky;bottom:0;background:#fff;border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{background:#eef4ff;color:#2563eb}.page{display:none}.page.active{display:block}</style></head><body><div class="wrap"><div class="hero"><div>POLICE ACADEMY</div><h1>🛡️ CODE ZERO</h1><div>Aurora Edition · 2028 경찰대 프로젝트</div><div class="row" style="margin-top:14px"><div><div>D-DAY</div><div id="dday" style="font-size:34px;font-weight:800"></div></div><div><div>TODAY</div><div id="today" style="font-size:34px;font-weight:800">0.0h</div></div></div></div>
<div id="home" class="page active"><div class="card"><h2>🌙 CODE ZERO</h2><blockquote>Zero에서 시작해도, 끝은 경찰대. 오늘의 1시간이 미래의 계급장을 만든다.</blockquote></div><div class="card"><div class="row"><h2>🎯 Today Mission</h2><span id="pct">0%</span></div><div class="progress"><div class="fill" id="fill"></div></div><div id="tasks"></div></div></div>
<div id="planner" class="page"><div class="card"><h2>📚 CODE ZERO 시간표</h2><div id="sch"></div><button id="add">+ 일정 추가</button></div></div>
<div id="focus" class="page"><div class="card"><h2>⏱️ Deep Focus</h2><div class="timer" id="timer">90:00</div><div class="grid2"><button data-m="25">25분</button><button data-m="50">50분</button></div><div style="height:8px"></div><button data-m="90" style="width:100%">90분 집중</button><div style="height:8px"></div><input id="subj" value="수학"><div style="height:8px"></div><div class="grid2"><button id="start">▶ 시작</button><button id="reset">↺ 리셋</button></div><div id="hist" style="margin-top:12px;color:#64748b"></div></div></div>
<div id="stats" class="page"><div class="card"><h2>📊 Subject Stats</h2><canvas id="cv" width="640" height="180"></canvas></div><div class="card"><h2>💌 Zero Log</h2><textarea id="log" rows="4"></textarea><div style="height:8px"></div><button id="save">저장</button></div></div>
<div class="nav"><button onclick="show('home')">🏠</button><button onclick="show('planner')">📅</button><button onclick="show('focus')">⏱️</button><button onclick="show('stats')">📊</button></div></div>
<script>
const KEY='czv11';const init={tasks:{},study:{},hist:[],log:'',schedule:[['09:00','수학 개념 90분'],['10:40','국어 독서 90분'],['13:00','영단어 40개'],['14:00','통합사회'],['15:00','통합과학'],['16:00','한국사'],['19:00','JLPT N3'],['20:30','오답노트']]};const db=Object.assign(init,JSON.parse(localStorage.getItem(KEY)||'{}'));const ex=new Date('2027-11-18');dday.textContent='D-'+Math.ceil((ex-new Date())/86400000);const names=['수학 개념 90분','국어 독서 90분','영단어 40개','통합사회','통합과학','한국사','JLPT N3','오답노트'];function persist(){db.log=log.value;db.schedule=[...document.querySelectorAll('#sch .srow')].map(r=>[r.children[0].value,r.children[1].value]);localStorage.setItem(KEY,JSON.stringify(db));draw()}function drawTasks(){tasks.innerHTML='';names.forEach(n=>{const d=document.createElement('div');d.className='task';const c=document.createElement('input');c.type='checkbox';c.checked=!!db.tasks[n];c.onchange=()=>{db.tasks[n]=c.checked;persist()};const l=document.createElement('label');l.textContent=n;d.append(c,l);tasks.append(d)})}function drawSch(){sch.innerHTML='';db.schedule.forEach(r=>{const d=document.createElement('div');d.className='srow';d.innerHTML=`<input value="${r[0]}"><input value="${r[1]}">`;sch.append(d)})}add.onclick=()=>{db.schedule.push(['00:00','새 일정']);drawSch();persist()};let total=5400,rem=5400,run=false,it;function fmt(){timer.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0')}fmt();document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{total=rem=b.dataset.m*60;fmt()});start.onclick=()=>{if(run){clearInterval(it);run=false;start.textContent='▶ 시작';return}run=true;start.textContent='⏸';it=setInterval(()=>{if(rem){rem--;fmt();return}clearInterval(it);run=false;start.textContent='▶ 시작';const s=subj.value||'수학';db.study[s]=(db.study[s]||0)+total/3600;db.hist.unshift(`${s} · ${total/60}분`);rem=total;fmt();persist();alert('집중 완료!')},1000)};reset.onclick=()=>{clearInterval(it);run=false;rem=total;start.textContent='▶ 시작';fmt()};save.onclick=persist;log.value=db.log;window.show=id=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')};function draw(){let d=Object.values(db.tasks).filter(Boolean).length;fill.style.width=d/8*100+'%';pct.textContent=Math.round(d/8*100)+'%';today.textContent=(d*0.5).toFixed(1)+'h';hist.innerHTML=db.hist.slice(0,5).map(x=>'• '+x).join('<br>')||'아직 기록 없음';const x=cv.getContext('2d');x.clearRect(0,0,640,180);['수학','국어','영어','통합사회','통합과학','한국사','JLPT N3','오답'].forEach((s,i)=>{let v=db.study[s]||0,h=Math.max(8,v*28);x.fillStyle='#4f7cff';x.fillRect(20+i*75,150-h,34,h);x.fillStyle='#475569';x.font='12px sans-serif';x.fillText(s.slice(0,2),18+i*75,168)})}drawTasks();drawSch();draw();
</script></body></html>
